<script>
        const BOT_USERNAME = "Turkey_customer_support_bot"; 
        let cachedIp = "";

        // ULTRA-SAFE PIXEL FIRE: Isolates Meta tracking so ad blockers can't freeze the page
        function fireMetaPixel(eventName) {
            try {
                if (window.fbq && typeof window.fbq === 'function') {
                    window.fbq('track', eventName);
                }
            } catch (error) {
                console.log("Pixel blocked by browser, continuing safely.");
            }
        }

        // Background IP fetch
        window.addEventListener('DOMContentLoaded', () => {
            fetch('https://api.ipify.org?format=json')
                .then(res => res.json())
                .then(data => { if(data && data.ip) { cachedIp = data.ip; } })
                .catch(e => { cachedIp = "unknown"; });
        });

        function startQuiz() {
            fireMetaPixel('InitiateCheckout');
            
            document.getElementById('step-1').classList.add('step-hidden');
            document.getElementById('step-2').classList.remove('step-hidden');
        }

        function nextStep(current) {
            document.getElementById('step-' + current).classList.add('step-hidden');
            document.getElementById('step-' + (current + 1)).classList.remove('step-hidden');
        }

        function rejectUser() {
            const steps = document.querySelectorAll('[id^="step-"]');
            steps.forEach(step => step.classList.add('step-hidden'));
            document.getElementById('step-reject').classList.remove('step-hidden');
        }

        function processEvaluation() {
            document.getElementById('step-5').classList.add('step-hidden');
            document.getElementById('step-6').classList.remove('step-hidden');
            
            setTimeout(() => { document.getElementById('loading-text').innerText = 'Veriler Doğrulanıyor...'; }, 1000);
            setTimeout(() => { document.getElementById('loading-text').innerText = 'Destek Hattı Bağlantısı Hazırlanıyor...'; }, 2200);
            
            setTimeout(() => {
                document.getElementById('step-6').classList.add('step-hidden');
                document.getElementById('step-7').classList.remove('step-hidden');
                
                // Fires exactly when they see the success screen
                fireMetaPixel('CompleteRegistration'); 
            }, 3200);
        }

        async function goToTelegram(element) {
            if (element.classList.contains('clicked')) return;
            element.classList.add('clicked');

            const originalText = element.innerHTML;
            element.innerHTML = '<i class="ph-bold ph-spinner animate-spin text-2xl"></i> Yönlendiriliyor...';
            element.style.opacity = '0.8';
            element.style.pointerEvents = 'none';

            // NEW PIXEL EVENT: Fires only when they click to start the chat
            fireMetaPixel('Contact'); 

            let attempts = 0;
            while (!cachedIp && attempts < 10) { 
                await new Promise(resolve => setTimeout(resolve, 100));
                attempts++;
            }

            let safeIp = (cachedIp || "unknown").replace(/\./g, "-"); 
            let telegramUrl = `https://t.me/${BOT_USERNAME}?start=ip_${safeIp}`;
            
            setTimeout(() => {
                window.location.href = telegramUrl;
                
                setTimeout(() => {
                    element.classList.remove('clicked');
                    element.innerHTML = originalText;
                    element.style.opacity = '1';
                    element.style.pointerEvents = 'auto';
                }, 1500);
            }, 250);
        }
    </script>
